services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8000"
    environment:
      PRACTICV_ENVIRONMENT: docker
      PRACTICV_DATABASE_URL: sqlite:///./practicv.db
      PRACTICV_FRONTEND_ORIGIN: http://localhost:3001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
